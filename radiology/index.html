<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <meta name="description" content="Interactive imaging teaching for medical students: echocardiography loops, atlas and quiz.">
  <title>Radiology teaching</title>
  <script src="core/file-warning.js"></script>
  <script type="module">
    import { h } from './core/dom.js';
    import { mountShell } from './core/shell.js';

    const { main } = mountShell('Radiology teaching');
    const area = (href, title, text) => h('li', {}, href
      ? h('a', { class: 'area', href }, h('h3', {}, title), h('p', {}, text))
      : h('div', { class: 'area' }, h('h3', {}, title), h('p', {}, text), h('p', { class: 'muted' }, 'Coming later.')));
    main.append(
      h('h2', {}, 'Interactive imaging for medical students'),
      h('p', {}, 'Learn to read images by working with them. Every module is free and runs in the browser.'),
      h('ul', { class: 'areas' },
        area('echo/index.html', 'Echocardiography', 'Standard views with probe placement and labeled anatomy. Loops and a quiz arrive as licensed clips are added.'),
        area(null, 'CT and MRI viewer', 'Scroll stacks and three planes with window presets.'),
        area(null, 'CT angiogram tour', 'A guided walk through the arteries.'),
        area(null, 'POCUS simulator', 'Practice probe moves to find the views.')));
  </script>
  <style>
    .areas { list-style: none; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
    .area { display: block; height: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); text-decoration: none; }
    a.area:hover { border-color: var(--accent); }
    a.area h3 { color: var(--accent); }
    .area h3 { margin-top: 0; }
  </style>
</head>
<body>
  <noscript><p>This page needs JavaScript.</p></noscript>
</body>
</html>
